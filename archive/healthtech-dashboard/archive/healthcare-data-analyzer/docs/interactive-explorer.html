<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Healthcare Data Explorer</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 18px}input,select,button{padding:9px;margin:4px}table{border-collapse:collapse;width:100%;margin-top:18px}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.badge{font-weight:700}</style><h1>Healthcare Data Explorer</h1><p>Interaktiv visning av det syntetiske datasettet i prosjektet.</p><input id="q" placeholder="Søk kommune"><select id="risk"><option value="">Alle risikonivå</option><option>high</option><option>medium</option><option>low</option></select><button id="sort">Sorter alder</button><table><thead><tr><th>ID</th><th>Alder</th><th>Kommune</th><th>Risiko</th><th>Medisin</th></tr></thead><tbody id="body"></tbody></table><script>const rows=[['1001',84,'Municipality A','high','yes'],['1002',73,'Municipality A','medium','yes'],['1003',68,'Municipality B','low','no'],['1004',91,'Municipality C','high','yes'],['1005',77,'Municipality A','medium','no'],['1006',82,'Municipality B','high','yes']];let asc=true;function draw(){const q=document.querySelector('#q').value.toLowerCase(),r=document.querySelector('#risk').value;let x=rows.filter(a=>(!q||a[2].toLowerCase().includes(q))&&(!r||a[3]===r)).sort((a,b)=>asc?a[1]-b[1]:b[1]-a[1]);document.querySelector('#body').innerHTML=x.map(a=>'<tr>'+a.map((v,i)=>'<td class="'+(i===3?'badge':'')+'">'+v+'</td>').join('')+'</tr>').join('')}document.querySelector('#q').oninput=draw;document.querySelector('#risk').onchange=draw;document.querySelector('#sort').onclick=()=>{asc=!asc;draw()};draw();</script>
