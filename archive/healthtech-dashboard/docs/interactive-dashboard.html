<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>HealthTech Dashboard</title><style>body{font:16px system-ui;max-width:960px;margin:40px auto;padding:0 18px;background:#0d1117;color:#e6edf3}button{padding:11px 15px;margin:5px;border:1px solid #30363d;border-radius:9px;background:#161b22;color:#e6edf3;cursor:pointer}button:hover{border-color:#58a6ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:20px 0}.card,.out{padding:18px;border:1px solid #30363d;border-radius:12px;background:#161b22}.active{border-color:#58a6ff}.bar{height:12px;background:#21262d;border-radius:8px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;width:0;background:#58a6ff;transition:.3s}</style><h1>HealthTech Dashboard</h1><p>Syntetisk dashboard med valg av visning.</p><div class="grid"><button data-i="0">Overview</button><button data-i="1">Devices</button><button data-i="2">Trends</button><button data-i="3">Alerts</button><button data-i="4">Audit</button></div><div class="out" id="out">Velg en funksjon.</div><div class="bar"><i id="bar"></i></div><script>const labels=["Overview","Devices","Trends","Alerts","Audit"],out=document.querySelector('#out'),bar=document.querySelector('#bar');document.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{out.innerHTML='<b>'+labels[i]+'</b><br>Interaktiv demonstrasjon aktiv.';bar.style.width=((i+1)/labels.length*100)+'%'})</script>
