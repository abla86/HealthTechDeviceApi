<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HealthTech device monitoring dashboard">
  <title>HealthTech Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-api-base="http://127.0.0.1:8000">

<header>
  <div>
    <p class="eyebrow">HEALTHTECH / DEVICE MONITORING</p>
    <h1>Device Dashboard</h1>
    <p class="subtitle">
      Simulated monitoring interface backed by a FastAPI REST API.
    </p>
  </div>

  <div class="api-status">
    <span id="status-dot"></span>
    <span id="api-status">Connecting...</span>
  </div>
</header>

<main>

  <section class="metrics">
    <article>
      <span>Total devices</span>
      <strong id="total">0</strong>
    </article>

    <article>
      <span>Online</span>
      <strong id="online">0</strong>
    </article>

    <article>
      <span>Offline</span>
      <strong id="offline">0</strong>
    </article>

    <article>
      <span>Average battery</span>
      <strong id="battery">0%</strong>
    </article>
  </section>

  <section class="panel">

    <div class="panel-header">
      <div>
        <p class="eyebrow">LIVE DATA</p>
        <h2>Connected devices</h2>
      </div>

      <button id="refresh">Refresh</button>
    </div>

    <div id="error" class="error hidden"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Device</th>
            <th>Type</th>
            <th>Status</th>
            <th>Battery</th>
          </tr>
        </thead>
        <tbody id="device-table"></tbody>
      </table>
    </div>

  </section>

</main>

<footer>
  HealthTech Dashboard · FastAPI · REST API · JavaScript
</footer>

<script src="script.js"></script>
</body>
</html>
