<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>HealthTech Device Monitor</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 18px;background:#0d1117;color:#e6edf3}button{padding:11px 15px;margin:5px;border:1px solid #30363d;border-radius:9px;background:#161b22;color:#e6edf3;cursor:pointer}button:hover,button:focus{border-color:#58a6ff}#board{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:24px 0}.card{padding:20px;border:1px solid #30363d;border-radius:12px}.active{border-color:#58a6ff;background:#13233a}.out{padding:18px;border-radius:12px;background:#161b22;min-height:70px}progress{width:100%}</style><h1>HealthTech Device Monitor</h1><p>Interactive synthetic device monitor. Select a device to inspect status and simulated vital telemetry.</p><div id="board"><button data-i="0">Monitor A</button><button data-i="1">Monitor B</button><button data-i="2">Monitor C</button><button data-i="3">Monitor D</button><button data-i="4">Monitor E</button></div><div class="out" id="out">Select a component.</div><progress id="progress" max="5" value="0"></progress><script>const names=["Monitor A","Monitor B","Monitor C","Monitor D","Monitor E"];const out=document.querySelector('#out'),p=document.querySelector('#progress');document.querySelectorAll('#board button').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('#board button').forEach(x=>x.classList.remove('active'));b.classList.add('active');p.value=i+1;out.innerHTML='<b>'+names[i]+'</b><br>Interactive inspection state: '+(i===names.length-1?'COMPLETE':'ACTIVE')+'<br><small>This is a deterministic local demonstration; it does not claim live infrastructure or patient data.</small>'});</script>
