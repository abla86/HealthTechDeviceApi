name: Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t healthtech-device-api:ci .

      - name: Start container
        run: docker run -d -p 8080:8080 --name healthtech-device-api healthtech-device-api:ci

      - name: Wait for API
        run: sleep 5

      - name: Verify health endpoint
        run: curl --fail http://localhost:8080/health

      - name: Verify statistics endpoint
        run: curl --fail http://localhost:8080/devices/stats

      - name: Stop container
        if: always()
        run: docker stop healthtech-device-api || true
