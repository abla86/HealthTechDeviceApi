name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore API
        run: dotnet restore HealthTechDeviceApi.csproj

      - name: Restore tests
        run: dotnet restore HealthTechDeviceApi.Tests/HealthTechDeviceApi.Tests.csproj

      - name: Check vulnerable NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet list HealthTechDeviceApi.csproj package --vulnerable --include-transitive --format json > nuget-vulnerabilities.json
          count="$(jq '[.. | objects | select(has("severity"))] | length' nuget-vulnerabilities.json)"
          if [ "$count" -ne 0 ]; then
            echo "Vulnerable NuGet packages detected:"
            cat nuget-vulnerabilities.json
            exit 1
          fi

      - name: Build API
        run: dotnet build HealthTechDeviceApi.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test HealthTechDeviceApi.Tests/HealthTechDeviceApi.Tests.csproj --configuration Release --no-restore --verbosity normal
