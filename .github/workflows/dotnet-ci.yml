name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore API
        run: dotnet restore HealthTechDeviceApi.csproj

      - name: Restore tests
        run: dotnet restore HealthTechDeviceApi.Tests/HealthTechDeviceApi.Tests.csproj

      - name: Check vulnerable NuGet packages
        run: dotnet list HealthTechDeviceApi.csproj package --vulnerable --include-transitive

      - name: Build API
        run: dotnet build HealthTechDeviceApi.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test HealthTechDeviceApi.Tests/HealthTechDeviceApi.Tests.csproj --configuration Release --no-restore --verbosity normal
